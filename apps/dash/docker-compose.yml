services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatekeepr_cms
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatekeepr_cms"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
